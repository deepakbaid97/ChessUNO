<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CHESS·UNO ARENA — Tactical Board &amp; Deck</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f59e0b' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 3L9 7h6l-3-4z'/%3E%3Cpath d='M7 11h10l-1.5 7h-7L7 11z'/%3E%3Cpath d='M5 21h14'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
      />
    </noscript>
    <style>
      body {
        margin: 0;
        background-color: #10131a;
        color: #e0e2ec;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .boot-loader {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background-color: #0b0e15;
      }
      .boot-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(245, 158, 11, 0.2);
        border-top-color: #f59e0b;
        border-radius: 50%;
        animation: bootSpin 0.8s linear infinite;
      }
      .boot-title {
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #ffc174;
      }
      .boot-sub {
        font-size: 0.75rem;
        color: #8b92a5;
      }
      @keyframes bootSpin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      // Automatically unregister stale Service Workers registered from other localhost projects
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var reg of registrations) {
            reg.unregister().then(function() {
              console.log('[ServiceWorker] Unregistered stale worker:', reg);
            });
          }
        });
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var name of names) {
              caches.delete(name);
            }
          });
        }
      }
    </script>
  </head>
  <body>
    <div id="app">
      <div class="boot-loader" aria-busy="true">
        <div class="boot-spinner"></div>
        <div class="boot-title">CHESS·UNO ARENA</div>
        <div class="boot-sub">Loading tactical environment...</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
