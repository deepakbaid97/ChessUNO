<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Rook Neutral Expression: Immovable, Stubborn, Dependable Protector -->
  <!-- Thick, Heavy, Level Eyebrows (Stone-solid) -->
  <path d="M96 108h26M134 108h26" stroke="var(--rook-ink,#211e2f)" stroke-width="6.5" stroke-linecap="round"/>

  <!-- Calm, Resolute Watchful Eyes -->
  <ellipse cx="112" cy="123" rx="10" ry="12" fill="var(--rook-ink,#211e2f)"/>
  <ellipse cx="144" cy="123" rx="10" ry="12" fill="var(--rook-ink,#211e2f)"/>

  <!-- Strong Steady Highlights -->
  <circle cx="108" cy="119" r="3.5" fill="#ffffff"/>
  <circle cx="140" cy="119" r="3.5" fill="#ffffff"/>
  <circle cx="114" cy="125" r="1.5" fill="#ffffff" opacity=".7"/>
  <circle cx="146" cy="125" r="1.5" fill="#ffffff" opacity=".7"/>

  <!-- Firm, Solid Straight Mouth (Unshakeable fortress) -->
  <path d="M116 142h24" stroke="var(--rook-ink,#211e2f)" stroke-width="6" stroke-linecap="round"/>
  <!-- Firm corner creases -->
  <line x1="115" y1="140" x2="115" y2="144" stroke="var(--rook-ink,#211e2f)" stroke-width="3" stroke-linecap="round"/>
  <line x1="141" y1="140" x2="141" y2="144" stroke="var(--rook-ink,#211e2f)" stroke-width="3" stroke-linecap="round"/>
</svg>

