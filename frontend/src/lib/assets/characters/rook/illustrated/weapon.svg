<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Fortress War Hammer / Stone Maul -->
  <!-- Hammer Shaft (Reinforced iron-bound timber) -->
  <!-- Pommel Base -->
  <rect x="214" y="210" width="16" height="12" rx="3" fill="var(--rook-metal,#f0f4f8)" stroke="var(--rook-ink,#211e2f)" stroke-width="4.5"/>
  <circle cx="222" cy="216" r="3" fill="var(--rook-gold,#e9b949)"/>

  <!-- Shaft extending through hand up into hammer head -->
  <line x1="220" y1="210" x2="204" y2="124" stroke="var(--rook-belt,#3e2c3a)" stroke-width="11" stroke-linecap="round"/>
  <line x1="220" y1="210" x2="204" y2="124" stroke="var(--rook-ink,#211e2f)" stroke-width="11" stroke-linecap="round" opacity=".25"/>
  <line x1="220" y1="202" x2="216" y2="198" stroke="var(--rook-gold,#e9b949)" stroke-width="3"/>

  <!-- Massive Stone Hammer Head (Faceted block with iron reinforcements) -->
  <!-- Main Stone Block -->
  <polygon points="186,134 234,106 244,122 196,150" fill="var(--rook-stone,#d9e2ec)" stroke="var(--rook-ink,#211e2f)" stroke-width="6.5" stroke-linejoin="round"/>
  <!-- Front Striking Face (Thick stone block) -->
  <polygon points="186,134 196,150 178,162 168,146" fill="var(--rook-metal,#f0f4f8)" stroke="var(--rook-ink,#211e2f)" stroke-width="6" stroke-linejoin="round"/>
  <!-- Top Face Shadow -->
  <polygon points="186,134 234,106 244,122 196,150" fill="var(--rook-stone-shadow,#8da2b5)" opacity=".5"/>

  <!-- Iron Reinforcement Bands & Brackets -->
  <path d="M208 122l8 14M220 114l8 14" stroke="var(--rook-metal-shadow,#9aaec4)" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Golden Keystone / Boss on Hammer Center -->
  <polygon points="208,132 218,126 224,136 214,142" fill="var(--rook-gold,#e9b949)" stroke="var(--rook-ink,#211e2f)" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="216" cy="134" r="2" fill="var(--rook-metal,#f0f4f8)"/>

  <!-- Striking Impact Highlight -->
  <line x1="172" y1="148" x2="180" y2="160" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity=".8"/>
</svg>

