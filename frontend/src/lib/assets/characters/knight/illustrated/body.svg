<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Knight Torso, Surcoat & Plate Armor -->
  <!-- Underlying Cape / Mantle flowing behind -->
  <path d="M68 126c-6 24-8 54-4 82h128c4-28 2-58-4-82l-22 4H90l-22-4Z" fill="var(--knight-cloth-shadow,#1d4e89)" stroke="var(--knight-ink,#25203b)" stroke-width="6" stroke-linejoin="round"/>
  
  <!-- Breastplate / Surcoat -->
  <path d="M78 124c8-14 26-22 50-22s42 8 50 22l12 78H66l12-78Z" fill="var(--knight-cloth,#3b7dc4)" stroke="var(--knight-ink,#25203b)" stroke-width="7" stroke-linejoin="round"/>
  <path d="M128 102c24 0 42 8 50 22l-6 40c-14-10-28-14-44-14s-30 4-44 14l-6-40c8-14 26-22 50-22Z" fill="var(--knight-cloth-light,#65a2e5)"/>

  <!-- Steel Cuirass (Center chest piece) -->
  <path d="M92 120c10-10 22-14 36-14s26 4 36 14l-4 44H96l-4-44Z" fill="var(--knight-metal,#e4ecf2)" stroke="var(--knight-ink,#25203b)" stroke-width="6" stroke-linejoin="round"/>
  <path d="M128 106v58" stroke="var(--knight-ink,#25203b)" stroke-width="4"/>
  <path d="M128 106v58h28l4-44c-9-8-19-12-32-14Z" fill="var(--knight-metal-shadow,#9eb4c3)" opacity=".7"/>

  <!-- Golden Heraldic Knight Emblem (Horse profile on chest) -->
