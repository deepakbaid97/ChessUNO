  <path d="M132 120c3 1 5 4 4 7" stroke="var(--knight-ink,#25203b)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Shoulder Pauldrons (Left & Right) -->
  <!-- Left Pauldron -->
  <path d="M60 126c-4-12 5-24 18-28l14 16-8 22c-12 2-21-3-24-10Z" fill="var(--knight-metal,#e4ecf2)" stroke="var(--knight-ink,#25203b)" stroke-width="5" stroke-linejoin="round"/>
  <path d="M78 98c4-1 8 0 14 16l-8 22c-3 1-6 0-8-2l2-36Z" fill="var(--knight-metal-shadow,#9eb4c3)"/>
  <circle cx="70" cy="118" r="3" fill="var(--knight-gold,#f3c95f)" stroke="var(--knight-ink,#25203b)" stroke-width="2"/>

  <!-- Right Pauldron -->
  <path d="M196 126c4-12-5-24-18-28l-14 16 8 22c12 2 21-3 24-10Z" fill="var(--knight-metal,#e4ecf2)" stroke="var(--knight-ink,#25203b)" stroke-width="5" stroke-linejoin="round"/>
  <path d="M178 98c-4-1-8 0-14 16l8 22c3 1 6 0 8-2l-2-36Z" fill="var(--knight-metal-shadow,#9eb4c3)"/>
  <circle cx="186" cy="118" r="3" fill="var(--knight-gold,#f3c95f)" stroke="var(--knight-ink,#25203b)" stroke-width="2"/>

  <!-- Heavy Belt & Golden Buckle -->
  <path d="M70 174h116v16H70z" fill="var(--knight-belt,#4a384e)" stroke="var(--knight-ink,#25203b)" stroke-width="6"/>
  <rect x="114" y="168" width="28" height="28" rx="6" fill="var(--knight-gold,#f3c95f)" stroke="var(--knight-ink,#25203b)" stroke-width="5"/>
  <rect x="122" y="176" width="12" height="12" rx="2" fill="var(--knight-belt,#4a384e)"/>

  <!-- Segmented Armored Fauld Skirt -->
  <path d="M74 190h108l-8 20h-24l-16-10-16 10H82l-8-20Z" fill="var(--knight-metal,#e4ecf2)" stroke="var(--knight-ink,#25203b)" stroke-width="6" stroke-linejoin="round"/>
  <path d="M128 190v10l16 10h18l6-20h-40Z" fill="var(--knight-metal-shadow,#9eb4c3)"/>
</svg>

