<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Knight Head, Jaw, and Mail Coif -->
  <!-- Chainmail Coif (Back & Neck) -->
  <path d="M82 92c0-28 20-48 46-48s46 20 46 48v28c0 30-20 52-46 52s-46-22-46-52V92Z" fill="var(--knight-metal-shadow,#9eb4c3)" stroke="var(--knight-ink,#25203b)" stroke-width="7" stroke-linejoin="round"/>
  <!-- Mail texture hint -->
  <path d="M86 112c8 4 16 4 24 0M146 112c8 4 16 4 24 0M94 136c10 4 22 4 34 0M128 136c10 4 22 4 34 0" stroke="var(--knight-ink,#25203b)" stroke-width="3" stroke-linecap="round" opacity=".4"/>

  <!-- Face Skin (Chin, Cheeks, Forehead) -->
  <path d="M88 94c0-24 18-42 40-42s40 18 40 42v24c0 25-18 44-40 44s-40-19-40-44V94Z" fill="var(--knight-skin,#f5bc8c)" stroke="var(--knight-ink,#25203b)" stroke-width="6" stroke-linejoin="round"/>
  
  <!-- Jawline Shadow & Confident Cleft Chin -->
  <path d="M96 132c8 18 20 26 32 26s24-8 32-26c-8 12-20 18-32 18s-24-6-32-18Z" fill="var(--knight-skin-shadow,#d78461)" opacity=".8"/>
  <path d="M125 152c2 2 4 2 6 0" stroke="var(--knight-skin-shadow,#d78461)" stroke-width="3" stroke-linecap="round"/>

  <!-- Hair curls peeking from under coif -->
  <path d="M84 96c4 6 5 14 3 20" stroke="var(--knight-belt,#4a384e)" stroke-width="5" stroke-linecap="round"/>
  <path d="M172 96c-4 6-5 14-3 20" stroke="var(--knight-belt,#4a384e)" stroke-width="5" stroke-linecap="round"/>
</svg>

