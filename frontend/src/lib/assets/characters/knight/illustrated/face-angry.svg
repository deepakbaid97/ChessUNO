<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Knight Angry Expression: Reckless Battle Cry & Roar -->
  <!-- Fierce Inward-Slanted V-Eyebrows -->
  <path d="M96 112l26-10M160 112l-26-10" stroke="var(--knight-ink,#25203b)" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Forehead furrow creases -->
  <path d="M125 106v6M131 106v6" stroke="var(--knight-ink,#25203b)" stroke-width="3" stroke-linecap="round"/>

  <!-- Intense Focused Eyes -->
  <ellipse cx="112" cy="123" rx="10" ry="11" fill="var(--knight-ink,#25203b)"/>
  <ellipse cx="144" cy="123" rx="10" ry="11" fill="var(--knight-ink,#25203b)"/>
  
  <circle cx="114" cy="120" r="3.5" fill="#ffffff"/>
  <circle cx="142" cy="120" r="3.5" fill="#ffffff"/>

  <!-- Battle Cry / Roar Mouth with Gritted Teeth -->
  <path d="M112 136h32l-4 18c-3 4-8 6-12 6s-9-2-12-6l-4-18Z" fill="#581622" stroke="var(--knight-ink,#25203b)" stroke-width="5" stroke-linejoin="round"/>
  <!-- Upper row of teeth -->
  <path d="M113 138h30v6h-30z" fill="#ffffff"/>
  <!-- Tooth division lines -->
  <line x1="123" y1="138" x2="123" y2="144" stroke="var(--knight-ink,#25203b)" stroke-width="2"/>
  <line x1="133" y1="138" x2="133" y2="144" stroke="var(--knight-ink,#25203b)" stroke-width="2"/>
</svg>

