  <!-- Elbow Couter (Pointed guard) -->
  <path d="M212 142l10 4-4 10-10-4 4-10Z" fill="var(--knight-gold,#f3c95f)" stroke="var(--knight-ink,#25203b)" stroke-width="3"/>

