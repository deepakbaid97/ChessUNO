<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Bishop Clerical Robes / Vestments -->
  <!-- Outer Flowing Robe (Left side) -->
  <path d="M82 136l-20 74c-2 8 4 14 12 14h54v-88H82z" fill="var(--bishop-robe,#6b46c1)" stroke="var(--bishop-ink,#211e2f)" stroke-width="6.5" stroke-linejoin="round"/>
  <!-- Outer Flowing Robe (Right side with shadow) -->
  <path d="M174 136l20 74c2 8-4 14-12 14h-54v-88h46z" fill="var(--bishop-robe-shadow,#44337a)" stroke="var(--bishop-ink,#211e2f)" stroke-width="6.5" stroke-linejoin="round"/>

  <!-- Robe Hem Gold Border -->
  <path d="M72 216c14-2 36-4 56-4s42 2 56 4l-2 8c-14-2-36-4-54-4s-40 2-54 4l-2-8Z" fill="var(--bishop-gold,#ecc94b)" stroke="var(--bishop-ink,#211e2f)" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Inner Liturgical Stole / Scapular (Draped silk sash) -->
  <!-- Left Stole Band -->
  <path d="M102 138l-4 68h18l4-68h-18z" fill="var(--bishop-stole,#edf2f7)" stroke="var(--bishop-ink,#211e2f)" stroke-width="5" stroke-linejoin="round"/>
  <!-- Right Stole Band -->
  <path d="M136 138l4 68h18l-4-68h-18z" fill="var(--bishop-stole-shadow,#cbd5e0)" stroke="var(--bishop-ink,#211e2f)" stroke-width="5" stroke-linejoin="round"/>

  <!-- Gold Fringe / Runes on Stole Ends -->
  <rect x="98" y="200" width="18" height="6" fill="var(--bishop-gold,#ecc94b)" stroke="var(--bishop-ink,#211e2f)" stroke-width="2.5"/>
  <rect x="140" y="200" width="18" height="6" fill="var(--bishop-gold,#ecc94b)" stroke="var(--bishop-ink,#211e2f)" stroke-width="2.5"/>
  <circle cx="107" cy="164" r="3" fill="var(--bishop-gold,#ecc94b)"/>
  <circle cx="107" cy="184" r="3" fill="var(--bishop-gold,#ecc94b)"/>
  <circle cx="149" cy="164" r="3" fill="var(--bishop-gold,#ecc94b)"/>
  <circle cx="149" cy="184" r="3" fill="var(--bishop-gold,#ecc94b)"/>

  <!-- Center Pectoral Medallion / Celestial Brooch -->
  <polygon points="128,136 138,146 128,156 118,146" fill="var(--bishop-gold,#ecc94b)" stroke="var(--bishop-ink,#211e2f)" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="128" cy="146" r="3.5" fill="var(--bishop-magic,#4fd1c5)" stroke="var(--bishop-ink,#211e2f)" stroke-width="2"/>
  <circle cx="128" cy="146" r="1.5" fill="var(--bishop-magic-bright,#e6fffa)"/>
</svg>
