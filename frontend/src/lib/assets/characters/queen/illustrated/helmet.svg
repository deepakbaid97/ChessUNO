<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Queen Imperial Crown -->
  <!-- Inner Royal Velvet Cap (Behind crown arches) -->
  <path d="M94 56c0-16 14-26 34-26s34 10 34 26l-2 18H96l-2-18Z" fill="var(--queen-cape,#e53e3e)" stroke="var(--queen-ink,#1a202c)" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- Velvet Cap Shadow -->
  <path d="M128 30c18 0 34 10 34 26l-2 18h-32V30Z" fill="var(--queen-cape-shadow,#9b2c2c)" opacity=".5"/>

  <!-- Five Pointed Imperial Crown Silhouette -->
  <!-- Left Spikes, Center Tallest Spike, Right Spikes -->
  <path d="M82 72l6-32 18 18 22-38 22 38 18-18 6 32H82Z" fill="var(--queen-gold,#ecc94b)" stroke="var(--queen-ink,#1a202c)" stroke-width="6" stroke-linejoin="round"/>
  <!-- Crown Right-Side Half Shadow -->
  <path d="M128 20l22 38 18-18 6 32h-46V20Z" fill="var(--queen-gold-shadow,#b7791f)" opacity=".6"/>

  <!-- Crown Base Circlet Band -->
  <path d="M80 68c14-3 32-4 48-4s34 1 48 4l-2 14c-14-3-32-4-46-4s-32 1-46 4l-2-14Z" fill="var(--queen-gold,#ecc94b)" stroke="var(--queen-ink,#1a202c)" stroke-width="5" stroke-linejoin="round"/>
  <path d="M82 76h92v3H82z" fill="var(--queen-gold-shadow,#b7791f)"/>

  <!-- Crown Jewels / Pearls atop each spike -->
  <!-- Center Tallest Pearl -->
  <circle cx="128" cy="18" r="5" fill="#ffffff" stroke="var(--queen-ink,#1a202c)" stroke-width="3"/>
  <circle cx="126" cy="16" r="1.5" fill="#ffffff"/>
  <!-- Inner Flank Rubies -->
  <circle cx="106" cy="56" r="3.5" fill="var(--queen-gem,#e53e3e)" stroke="var(--queen-ink,#1a202c)" stroke-width="2.5"/>
  <circle cx="150" cy="56" r="3.5" fill="var(--queen-gem,#e53e3e)" stroke="var(--queen-ink,#1a202c)" stroke-width="2.5"/>
  <!-- Outer Flank Pearls -->
  <circle cx="88" cy="38" r="4" fill="#ffffff" stroke="var(--queen-ink,#1a202c)" stroke-width="2.5"/>
  <circle cx="168" cy="38" r="4" fill="#ffffff" stroke="var(--queen-ink,#1a202c)" stroke-width="2.5"/>

  <!-- Embedded Rubies on the Crown Circlet -->
  <polygon points="128,68 132,73 128,78 124,73" fill="var(--queen-gem,#e53e3e)" stroke="var(--queen-ink,#1a202c)" stroke-width="2"/>
  <circle cx="104" cy="74" r="2.5" fill="var(--queen-gem,#e53e3e)"/>
  <circle cx="152" cy="74" r="2.5" fill="var(--queen-gem,#e53e3e)"/>
</svg>
