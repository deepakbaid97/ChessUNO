<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Queen Angry Face: Intimidating Wrath & Commanding Fury -->
  <!-- Fierce Angled Slash Eyebrows -->
  <path d="M104 88l18 6" stroke="var(--queen-ink,#1a202c)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M152 88l-18 6" stroke="var(--queen-ink,#1a202c)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Left Eye: Narrowed, Blazing with Energy & Sharp Lashes -->
  <path d="M106 95c5-4 12-3 16 2-4 4-11 5-16-2Z" fill="var(--queen-energy,#63b3ed)" stroke="var(--queen-ink,#1a202c)" stroke-width="3"/>
  <circle cx="114" cy="95" r="2.2" fill="#ffffff"/>

  <!-- Right Eye: Narrowed, Blazing -->
  <path d="M150 95c-5-4-12-3-16 2 4 4 11 5 16-2Z" fill="var(--queen-energy,#63b3ed)" stroke="var(--queen-ink,#1a202c)" stroke-width="3"/>
  <circle cx="142" cy="95" r="2.2" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M127 103l-1 5 3 0" stroke="var(--queen-skin-shadow,#dd6b20)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Fierce Battle Snarl with Sharp Teeth -->
  <path d="M118 115c3-3 17-3 20 0-2 6-18 6-20 0Z" fill="var(--queen-ink,#1a202c)" stroke="var(--queen-ink,#1a202c)" stroke-width="2"/>
  <line x1="120" y1="115" x2="136" y2="115" stroke="#ffffff" stroke-width="2"/>

  <!-- Beauty Mark -->
  <circle cx="150" cy="106" r="1.3" fill="var(--queen-ink,#1a202c)"/>
</svg>

