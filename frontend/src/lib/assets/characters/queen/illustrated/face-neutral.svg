<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Queen Neutral Face: Confident, Commanding, Elegant Smirk -->
  <!-- Arched Sleek Eyebrows (Left slightly raised in commanding confidence) -->
  <path d="M104 84c6-6 16-5 20-1" stroke="var(--queen-ink,#1a202c)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M132 86c5-4 14-4 18 0" stroke="var(--queen-ink,#1a202c)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Left Eye: Sharp Almond Eye with Royal Eyelashes & Energy Glow -->
  <path d="M106 94c5-3 13-3 18 2-5 4-13 4-18-2Z" fill="#ffffff" stroke="var(--queen-ink,#1a202c)" stroke-width="2.5"/>
  <path d="M104 93c6-4 16-4 22 2" stroke="var(--queen-ink,#1a202c)" stroke-width="3.8" stroke-linecap="round"/>
  <ellipse cx="116" cy="95" rx="4" ry="4.5" fill="var(--queen-ink,#1a202c)"/>
  <circle cx="115" cy="94" r="2.2" fill="var(--queen-energy,#63b3ed)"/>
  <circle cx="114" cy="93" r="1.2" fill="#ffffff"/>

  <!-- Right Eye: Piercing Almond Eye -->
  <path d="M132 96c5-3 13-3 18 2-5 4-13 4-18-2Z" fill="#ffffff" stroke="var(--queen-ink,#1a202c)" stroke-width="2.5"/>
  <path d="M130 95c6-4 16-4 22 2" stroke="var(--queen-ink,#1a202c)" stroke-width="3.8" stroke-linecap="round"/>
  <ellipse cx="140" cy="97" rx="4" ry="4.5" fill="var(--queen-ink,#1a202c)"/>
  <circle cx="141" cy="96" r="2.2" fill="var(--queen-energy,#63b3ed)"/>
  <circle cx="142" cy="95" r="1.2" fill="#ffffff"/>

  <!-- Delicate Royal Nose -->
  <path d="M127 104l-1 5 3 0" stroke="var(--queen-skin-shadow,#dd6b20)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Confident, Elegant Royal Smirk (Corner curved up with subtle lip color) -->
  <path d="M120 116c4 3 12 3 18-3" stroke="var(--queen-ink,#1a202c)" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="138" cy="113" r="1.2" fill="var(--queen-cape,#e53e3e)"/>

  <!-- Beauty Mark below right eye -->
  <circle cx="148" cy="106" r="1.3" fill="var(--queen-ink,#1a202c)"/>
</svg>

