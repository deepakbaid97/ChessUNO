<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Queen Scared Face: Startled Shock, Royal Composure Breached -->
  <!-- High Angled Tense Eyebrows -->
  <path d="M104 84c5 3 13 2 17-2" stroke="var(--queen-ink,#1a202c)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M135 82c5-4 13-5 17-2" stroke="var(--queen-ink,#1a202c)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Left Eye: Wide, Startled with Dilated Pupil -->
  <ellipse cx="114" cy="96" rx="8" ry="8.5" fill="#ffffff" stroke="var(--queen-ink,#1a202c)" stroke-width="3"/>
  <circle cx="114" cy="96" r="3.5" fill="var(--queen-ink,#1a202c)"/>
  <circle cx="112" cy="94" r="1.5" fill="#ffffff"/>

  <!-- Right Eye: Wide, Startled -->
  <ellipse cx="142" cy="96" rx="8" ry="8.5" fill="#ffffff" stroke="var(--queen-ink,#1a202c)" stroke-width="3"/>
  <circle cx="142" cy="96" r="3.5" fill="var(--queen-ink,#1a202c)"/>
  <circle cx="140" cy="94" r="1.5" fill="#ffffff"/>

  <!-- Nervous Sweat Drop on Cheek -->
  <path d="M96 98c-2 3 0 6 3 6s4-3 3-6c-1-2-4-2-6 0Z" fill="var(--queen-energy,#63b3ed)" opacity=".85"/>

  <!-- Nose -->
  <path d="M127 103l-1 5 3 0" stroke="var(--queen-skin-shadow,#dd6b20)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Gasping Stunned Mouth -->
  <ellipse cx="128" cy="116" rx="5" ry="6" fill="var(--queen-ink,#1a202c)"/>
  <ellipse cx="128" cy="118" rx="3" ry="3" fill="#e53e3e"/>

  <!-- Beauty Mark -->
  <circle cx="152" cy="107" r="1.3" fill="var(--queen-ink,#1a202c)"/>
</svg>

