<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- King Angry Face: Royal Outrage & Commanding Battle Roar -->
  <!-- Heavy Furrowed V-Angled Eyebrows -->
  <path d="M104 88l18 6" stroke="var(--king-hair,#4a5568)" stroke-width="5" stroke-linecap="round"/>
  <path d="M152 88l-18 6" stroke="var(--king-hair,#4a5568)" stroke-width="5" stroke-linecap="round"/>

  <!-- Left Eye: Narrowed, Blazing Sovereign Wrath -->
  <path d="M106 94c5-4 12-3 16 2-4 4-11 5-16-2Z" fill="var(--king-energy,#f6e05e)" stroke="var(--king-ink,#1a202c)" stroke-width="3"/>
  <circle cx="114" cy="94" r="2.2" fill="#ffffff"/>

  <!-- Right Eye: Narrowed, Blazing -->
  <path d="M150 94c-5-4-12-3-16 2 4 4 11 5 16-2Z" fill="var(--king-energy,#f6e05e)" stroke="var(--king-ink,#1a202c)" stroke-width="3"/>
  <circle cx="142" cy="94" r="2.2" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M128 92l-2 14 6 0" stroke="var(--king-skin-shadow,#dd6b20)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Roaring Royal Battle Cry with Gilded Teeth -->
  <path d="M118 118c3-4 17-4 20 0-2 8-18 8-20 0Z" fill="var(--king-ink,#1a202c)" stroke="var(--king-ink,#1a202c)" stroke-width="2"/>
  <line x1="120" y1="118" x2="136" y2="118" stroke="#ffffff" stroke-width="2.2"/>
</svg>

