<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- King Scared Face: Visibly Vulnerable ("Check!"), Panicked Shock -->
  <!-- High Angled Panicked Eyebrows -->
  <path d="M104 82c5 4 14 3 18-2" stroke="var(--king-hair,#4a5568)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M134 80c5-5 14-6 18-2" stroke="var(--king-hair,#4a5568)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Left Eye: Wide, Dilated White with Pinprick Trembling Pupil -->
  <ellipse cx="114" cy="94" rx="8" ry="8.5" fill="#ffffff" stroke="var(--king-ink,#1a202c)" stroke-width="3"/>
  <circle cx="114" cy="94" r="3" fill="var(--king-ink,#1a202c)"/>
  <circle cx="113" cy="93" r="1.2" fill="#ffffff"/>

  <!-- Right Eye: Wide, Dilated Pinprick Pupil -->
  <ellipse cx="142" cy="94" rx="8" ry="8.5" fill="#ffffff" stroke="var(--king-ink,#1a202c)" stroke-width="3"/>
  <circle cx="142" cy="94" r="3" fill="var(--king-ink,#1a202c)"/>
  <circle cx="141" cy="93" r="1.2" fill="#ffffff"/>

  <!-- Beads of Nervous Sweat on Brow & Temple -->
  <path d="M96 92c-2 4 0 7 3 7s5-3 3-7c-1-2-5-2-6 0Z" fill="var(--king-energy,#f6e05e)" opacity=".85"/>
  <circle cx="156" cy="96" r="2.5" fill="var(--king-energy,#f6e05e)" opacity=".8"/>

  <!-- Nose -->
  <path d="M128 92l-2 14 6 0" stroke="var(--king-skin-shadow,#dd6b20)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Gasping Panicked Mouth (O-shaped shock through trembling mustache) -->
  <ellipse cx="128" cy="120" rx="5.5" ry="6.5" fill="var(--king-ink,#1a202c)"/>
  <ellipse cx="128" cy="122" rx="3.5" ry="3.5" fill="#e53e3e"/>
</svg>
